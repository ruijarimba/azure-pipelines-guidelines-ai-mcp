name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        # TreatWarningsAsErrors=true is already set in Directory.Build.props.
        # The explicit flag here makes the intent visible at CI level.
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          retention-days: 7

  verify-pack:
    name: Verify NuGet pack
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Pack all src/ libraries
        # Inject a deterministic preview version so the pack step never fails
        # due to a missing PackageVersion.  Real versions are set at release time.
        run: >
          dotnet pack
          --no-restore
          --configuration Release
          /p:PackageVersion=0.0.0-ci
          --output nupkgs
          src/AzurePipelines.Guidelines.Core/AzurePipelines.Guidelines.Core.csproj
          src/AzurePipelines.Guidelines.Parsing/AzurePipelines.Guidelines.Parsing.csproj
          src/AzurePipelines.Guidelines.Rules/AzurePipelines.Guidelines.Rules.csproj
          src/AzurePipelines.Guidelines.Analysis/AzurePipelines.Guidelines.Analysis.csproj
          src/AzurePipelines.Guidelines.Mcp/AzurePipelines.Guidelines.Mcp.csproj

      - name: Pack CLI global tool
        run: >
          dotnet pack
          --no-restore
          --configuration Release
          /p:PackageVersion=0.0.0-ci
          --output nupkgs
          tools/AzurePipelines.Guidelines.Cli/AzurePipelines.Guidelines.Cli.csproj

      - name: List produced packages
        run: ls -la nupkgs/
