name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        # TreatWarningsAsErrors=true is already set in Directory.Build.props.
        # The explicit flag here makes the intent visible at CI level.
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          retention-days: 7

  docker-build:
    name: Docker build (verify)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: azure-pipelines-guidelines-mcp:ci

  verify-pack:
    name: Verify NuGet pack
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Pack src/ libraries
        # Inject a deterministic preview version so the pack step never fails
        # due to a missing PackageVersion. Real versions are set at release time.
        # dotnet pack accepts only one project per invocation, so we loop.
        run: |
          for proj in \
            src/AzurePipelines.Guidelines.Core/AzurePipelines.Guidelines.Core.csproj \
            src/AzurePipelines.Guidelines.Parsing/AzurePipelines.Guidelines.Parsing.csproj \
            src/AzurePipelines.Guidelines.Rules/AzurePipelines.Guidelines.Rules.csproj \
            src/AzurePipelines.Guidelines.Analysis/AzurePipelines.Guidelines.Analysis.csproj \
            src/AzurePipelines.Guidelines.Mcp/AzurePipelines.Guidelines.Mcp.csproj; do
            dotnet pack "$proj" --no-build --configuration Release /p:PackageVersion=0.0.0-ci --output nupkgs
          done

      - name: Pack CLI global tool (adog)
        run: >
          dotnet pack
          tools/AzurePipelines.Guidelines.Cli/AzurePipelines.Guidelines.Cli.csproj
          --no-build
          --configuration Release
          /p:PackageVersion=0.0.0-ci
          --output nupkgs

      - name: Pack MCP global tool (adog-mcp)
        run: >
          dotnet pack
          tools/AzurePipelines.Guidelines.Mcp.Host/AzurePipelines.Guidelines.Mcp.Host.csproj
          --no-build
          --configuration Release
          /p:PackageVersion=0.0.0-ci
          --output nupkgs

      - name: List produced packages
        run: ls -la nupkgs/
