name: Release

# Fires when a version tag is pushed (e.g. v1.0.0 or v1.2.3-preview.1).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  publish-nuget:
    name: Publish NuGet packages & global tools
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------
    # SETUP REQUIRED before this workflow can publish:
    #
    # 1. Create a "release" environment in the repository settings
    #    (Settings → Environments → New environment).
    # 2. Add a required reviewer to that environment.
    # 3. Add these secrets to that environment:
    #    - NUGET_API_KEY       — NuGet.org API key
    #    - DOCKERHUB_USERNAME  — Docker Hub username
    #    - DOCKERHUB_TOKEN     — Docker Hub access token
    #
    # Until those steps are completed this job will be skipped entirely.
    # -------------------------------------------------------------------
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Derive version from tag
        id: version
        # Strip the leading 'v' from the tag name (e.g. v1.2.3 → 1.2.3).
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack src/ libraries
        # dotnet pack accepts only one project per invocation, so we loop.
        run: |
          for proj in \
            src/AzurePipelines.Guidelines.Core/AzurePipelines.Guidelines.Core.csproj \
            src/AzurePipelines.Guidelines.Parsing/AzurePipelines.Guidelines.Parsing.csproj \
            src/AzurePipelines.Guidelines.Rules/AzurePipelines.Guidelines.Rules.csproj \
            src/AzurePipelines.Guidelines.Analysis/AzurePipelines.Guidelines.Analysis.csproj \
            src/AzurePipelines.Guidelines.Mcp/AzurePipelines.Guidelines.Mcp.csproj; do
            dotnet pack "$proj" --no-build --configuration Release /p:PackageVersion=${{ steps.version.outputs.PACKAGE_VERSION }} --output nupkgs
          done

      - name: Pack CLI global tool (adog)
        run: >
          dotnet pack
          tools/AzurePipelines.Guidelines.Cli/AzurePipelines.Guidelines.Cli.csproj
          --no-build
          --configuration Release
          /p:PackageVersion=${{ steps.version.outputs.PACKAGE_VERSION }}
          --output nupkgs

      - name: Pack MCP global tool (adog-mcp)
        run: >
          dotnet pack
          tools/AzurePipelines.Guidelines.Mcp.Host/AzurePipelines.Guidelines.Mcp.Host.csproj
          --no-build
          --configuration Release
          /p:PackageVersion=${{ steps.version.outputs.PACKAGE_VERSION }}
          --output nupkgs

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  publish-docker:
    name: Publish Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: publish-nuget
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "IMAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ruijarimba/azure-pipelines-guidelines-mcp:latest
            ruijarimba/azure-pipelines-guidelines-mcp:${{ steps.version.outputs.IMAGE_VERSION }}
