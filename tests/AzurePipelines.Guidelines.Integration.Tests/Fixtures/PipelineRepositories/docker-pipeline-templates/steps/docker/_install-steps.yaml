# Install Docker 

parameters:
  - name: dockerVersion
    type: string
    displayName: 'Docker version to install. Use "none" to skip installation.'
    default: 'none'

steps:
  - ${{ if ne(lower(parameters.dockerVersion), 'none') }}:
    - task: DockerInstaller@0
      displayName: Docker Installer
      inputs:
        dockerVersion: ${{ parameters.dockerVersion }}
        releaseType: stable