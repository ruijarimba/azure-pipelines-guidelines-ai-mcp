# Build and push a Docker image to a container registry.

parameters:
  - name: dockerVersion
    type: string
    displayName: 'Docker version to install. Use "none" to skip installation.'
    default: 'none'

  # an object containing the settings to authenticate with the container registry
  # containerRegistry: name of the service connection to the container registry
  - name: authentication
    type: object
    displayName: 'Authentication'
    # default:
    #   containerRegistry: ''
  
  # an object containing the details of the Docker image to build and push
  # repository: the name of the repository to use (username/contosoRepository for DockerHub)
  # dockerFile: the path to the Dockerfile to use
  # dockerFolder: the path to the folder containing the Dockerfile
  # arguments: a dictionary of build arguments to pass to the Docker build command
  # tags: a comma-separated list of tags to apply to the image
  - name: dockerImage
    type: object
    displayName: 'Docker image details'
    # default:
    #   repository: ''
    #   dockerFile: ''
    #   dockerFolder: ''
    #   arguments:
    #     - '--secret id=mysecret,src=mysecret.txt'
    #     - '--build-arg key=value'
    #   tags: 'tag1,tag2'

  # An object containing the settings for the static analysis:
  # - enabled: Set to true to run the static analysis
  # - checkovExclusions: Comma-separated list of Checkov checks to exclude
  - name: staticAnalysis
    type: object
    displayName: 'Static analysis settings'
    # default:
    #   enabled: true
    #   checkovExclusions: ''

steps:
  - template: /pipelines/steps/_validate-input-steps.yaml
    parameters:
      inputs:
        - name: 'dockerVersion'
          value: ${{ parameters.dockerVersion }}
        - name: 'dockerImage.repository'
          value: ${{ parameters.dockerImage.repository }}
        - name: 'dockerImage.dockerFile'
          value: ${{ parameters.dockerImage.dockerFile }}
        - name: 'dockerImage.dockerFolder'
          value: ${{ parameters.dockerImage.dockerFolder }}
        - name: 'dockerImage.tags'
          value: ${{ parameters.dockerImage.tags }}
      printValues: true

  - template: /pipelines/steps/docker/_install-steps.yaml
    parameters:
      dockerVersion: ${{ parameters.dockerVersion }}

  - script: |
      printf "Image details:\n%s" "${DOCKER_IMAGE}"
    displayName: 'Print Docker image details (debug mode only)'
    condition: eq(variables['System.Debug'], 'true')
    env:
      DOCKER_IMAGE: ${{ convertToJson(parameters.dockerImage) }}

  - ${{ if parameters.staticAnalysis.enabled }}:
    - template: /pipelines/steps/checkov/scan-dockerfile-steps.yaml
      parameters:
        dockerFolder: ${{ parameters.dockerImage.dockerFolder }}
        exclusions: ${{ parameters.staticAnalysis.checkovExclusions }}
        testRunTitle: checkov-docker:${{ parameters.dockerImage.repository }}

  - template: /pipelines/steps/docker/_run-authenticated-steps.yaml
    parameters:
      authentication: ${{ parameters.authentication }}
      steps: 
        - task: Docker@2
          displayName: 'Build Docker image'
          inputs:
            repository: ${{ parameters.dockerImage.repository }}
            command: 'build'
            Dockerfile: ${{ parameters.dockerImage.dockerFile }}
            tags: ${{ coalesce(parameters.dockerImage.tags, '$(Build.BuildId)') }}
            ${{ if gt(length(parameters.dockerImage.arguments), 0) }}: # it works with both arrays and strings
              arguments: ${{ join(' ', parameters.dockerImage.arguments) }}"

        - task: Docker@2
          displayName: 'Push Docker image'
          inputs:
            repository: ${{ parameters.dockerImage.repository }}
            command: 'push'
            Dockerfile: ${{ parameters.dockerImage.dockerFile }}
            tags: ${{ coalesce(parameters.dockerImage.tags, '$(Build.BuildId)') }}
