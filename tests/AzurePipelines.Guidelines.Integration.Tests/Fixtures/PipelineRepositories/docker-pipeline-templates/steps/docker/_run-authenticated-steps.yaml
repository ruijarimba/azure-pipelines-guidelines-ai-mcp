# A wrapper template for running a list of Docker-related tasks 
# that require authentication with a container registry.
#
# Steps:
# - Login to container registry
# - Run the list of steps provided by the consumer
# - Logout of container registry

parameters:
  # an object containing the settings to authenticate with the container registry
  # containerRegistry: name of the service connection to the container registry
  - name: authentication
    type: object
    displayName: 'Authentication'
    # default:
    #   containerRegistry: ''

  - name: steps
    type: stepList
    displayName: 'Docker-related steps to run'
    default: []

steps:
  - task: Docker@2
    displayName: Login to container registry
    inputs:
      command: login
      containerRegistry: ${{ parameters.authentication.containerRegistry }}

  - ${{ parameters.steps }}

  - task: Docker@2
    displayName: Logout of container registry
    inputs:
      command: logout
      containerRegistry: ${{ parameters.authentication.containerRegistry }}
    condition: always()
