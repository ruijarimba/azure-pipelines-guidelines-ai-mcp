# Build and push a Docker image to a container registry.
#
# Consumers of this job are expected to provide a variables template such as:
# /pipelines/variables/docker/{image-name}-variables.yaml
#
# The variables template should contain all the variables required, as per YAML-001

parameters:
  # Set the agent pool to use for this job.
  # If not set, the agent pool must be set at the pipeline level.
  - name: agentPool
    type: object
    displayName: 'Agent pool (optional)'
    default: ''

  - name: azureDevOpsEnvironment
    type: string
    displayName: 'Azure DevOps environment'

  - name: jobTimeoutInMinutes
    type: number
    displayName: 'Job timeout in minutes'
    default: 15

  - name: baseVariablesTemplateDir
    type: string
    displayName: 'Base folder where to find the variables YAML template'
    default: '/pipelines/variables/docker'
  
  - name: imageName
    type: string
    displayName: 'Docker image name - e.g. my-repository/my-image'

  - name: arguments
    type: object
    displayName: 'An array with arguments to pass to the Docker build command'
    default: []
    # - '--secret id=mysecret,src=mysecret.txt'
    # - '--build-arg key=value'

  - name: validationOnly
    type: boolean
    displayName: 'Validation only'
    default: false

  - name: runStaticAnalysis
    type: boolean
    displayName: 'Run static analysis'
    default: false

  - name: preSteps
    type: stepList
    displayName: 'Pre-steps'
    default:
      - checkout: self

  - name: postSteps
    type: stepList
    displayName: 'Post-steps'
    default: []

jobs:
  - deployment: docker_${{ replace(replace(parameters.imageName, '/', '_'), '-', '_') }}
    displayName: 'docker:${{ parameters.imageName }}'
    environment: ${{ parameters.azureDevOpsEnvironment }}
    ${{ if parameters.agentPool }}:
      pool: ${{ parameters.agentPool }}
    timeoutInMinutes: ${{ parameters.jobTimeoutInMinutes }}
    cancelTimeoutInMinutes: 1
    variables:
      # Template reference to the repo where this template was included from. 
      # Setting variables at the job level allows to run this job in parallel for different stacks/instances,
      # without having to worry about overriding the variables for the other instances.
      - template: ${{ parameters.baseVariablesTemplateDir }}/${{ parameters.imageName }}-variables.yaml@self
    strategy:
      runOnce:
        deploy:
          steps:
            - ${{ parameters.preSteps }}
            - template: /pipelines/steps/docker/build-push-image-steps.yaml
              parameters:
                dockerVersion: ${{ coalesce(variables.docker_version, 'none') }}
                authentication:
                  containerRegistry: ${{ variables.docker_containerRegistry }}
                dockerImage:
                  repository: ${{ variables.docker_repository }}
                  dockerFile: ${{ variables.docker_dockerFile }}
                  dockerFolder: ${{ variables.docker_dockerFolder }}
                  arguments: ${{ parameters.arguments }}
                  ${{ if parameters.validationOnly }}:
                    tags: temp
                  ${{ else }}:
                    tags: ${{ variables.docker_tags }}
                staticAnalysis: 
                  enabled: ${{ parameters.runStaticAnalysis }}
                  checkovExclusions: ${{ coalesce(variables.docker_checkovExclusions, '') }}
            - ${{ parameters.postSteps }}
