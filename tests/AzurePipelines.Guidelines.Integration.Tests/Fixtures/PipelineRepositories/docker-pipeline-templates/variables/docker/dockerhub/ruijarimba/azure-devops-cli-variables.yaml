variables:
  - template: /pipelines/variables/docker/common-variables.yaml

  - name: docker_dockerFolder
    value: '$(System.DefaultWorkingDirectory)/docker/azure-devops-cli'
    readonly: true

  - name: docker_dockerFile
    value: '$(docker_dockerFolder)/Dockerfile'
    readonly: true
  
  - name: docker_repository
    value: 'ruijarimba/azure-devops-cli'
    readonly: true
  
  - name: docker_tags
    value: '$(Build.BuildId)'
    readonly: true
  
  # CKV_DOCKER_2: Ensure that HEALTHCHECK instructions have been added to container images
  - name: docker_checkovExclusions
    value: 'CKV_DOCKER_2'