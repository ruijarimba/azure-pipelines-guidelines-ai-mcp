# Scan a Terraform plan with Checkov and publish the results into the pipeline.
#
# See https://www.checkov.io/7.Scan%20Examples/Terraform%20Plan%20Scanning.html

parameters:
  - name: workingFolder
    type: string
    displayName: 'Terragrunt/Terraform working folder'

  - name: terraformPlanFile
    type: string
    displayName: 'Terraform plan file'

  - name: exclusions
    type: string
    displayName: 'Comma-separated list of Checkov checks to exclude'

  - name: testRunTitle
    type: string
    displayName: 'Test run title'
    default: 'checkov-terraform'

steps:
  - script: >-
      echo "Trying to convert the Terraform plan to JSON format..." &&
      terraform show -json -no-color $TF_PLAN | jq > $TF_PLAN_JSON

      set -x

      echo "Scanning the Terraform plan: $TF_PLAN" &&
      checkov --framework terraform_plan
      --file $TF_PLAN_JSON
      --soft-fail
      --output cli
      --skip-check "$EXCLUSIONS"

      set +x
    condition: eq(variables['System.Debug'], 'true')
    displayName: 'Checkov scan (debug mode)'
    workingDirectory: ${{ parameters.workingFolder }}
    env:
      TF_PLAN: ${{ parameters.terraformPlanFile }}
      TF_PLAN_JSON: $(Agent.TempDirectory)/tfplan_debug.json
      EXCLUSIONS: ${{ coalesce(parameters.exclusions, 'DUMMY') }}
      LOG_LEVEL: debug

  # --output-file-path flag doesn't seem to work as expected,
  # i.e. it seems it's not possible to specify the output file path.
  # Output file format is 'results_{format}.xml', e.g. 'results_junitxml.xml'.
  - script: >-
      echo "Trying to convert the Terraform plan to JSON format..." &&
      terraform show -json -no-color $TF_PLAN | jq > $TF_PLAN_JSON

      set -x

      echo "Scanning the Terraform plan..." &&
      checkov --framework terraform_plan
      --file $TF_PLAN_JSON
      --soft-fail
      --quiet
      --output junitxml
      --output-file-path $OUTPUT_FOLDER
      --skip-check "$EXCLUSIONS"

      set +x
    displayName: 'Checkov scan'
    workingDirectory: ${{ parameters.workingFolder }}
    env:
      TF_PLAN: ${{ parameters.terraformPlanFile }}
      TF_PLAN_JSON: $(Agent.TempDirectory)/tfplan.json
      EXCLUSIONS: ${{ coalesce(parameters.exclusions, 'DUMMY') }}
      OUTPUT_FOLDER: $(Agent.TempDirectory)
  
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/results_junitxml.xml'
      testRunTitle: ${{ parameters.testRunTitle }}
      searchFolder: $(Agent.TempDirectory)
      failTaskOnFailureToPublishResults: true
      failTaskOnMissingResultsFile: false
    displayName: 'Publish Checkov results: ${{ parameters.testRunTitle }}'