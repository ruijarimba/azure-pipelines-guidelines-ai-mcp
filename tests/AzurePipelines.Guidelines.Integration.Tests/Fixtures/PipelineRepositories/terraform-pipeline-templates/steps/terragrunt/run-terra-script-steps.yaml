# Runs a Terragrunt or Terraform script with environment variables:
# - Terraform registry and/or providers (aws, azure, etc) variables
# - Remote state (Azure Blob Storage, etc) variables
# - Custom Terraform environment variables that might be needed (TF_VAR_*, etc)
# - Other variables used in CI/CD pipelines

parameters:
- name: displayName
  type: string
  displayName: 'Script display name'

- name: scriptToExecute
  type: string
  displayName: 'Script to execute'

- name: timeoutInMinutes
  type: string
  displayName: 'Time to wait for this task to complete before the server kills it'
  default: ''

# This object will contain the authentication details for the terraform registry 
# and the providers such as aws, azure, azure devops, etc
#
# terraform registry authentication details:
# https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/guides/service_principal_client_secret
# terraformRegistryToken: The token to use for authentication.
#
# azuredevops provider authentication details:
# https://registry.terraform.io/providers/microsoft/azuredevops/latest/docs/guides/authenticating_using_the_personal_access_token
# azureDevOpsToken: The Azure DevOps token to use for authentication.
# azureDevOpsServiceUrl: The Azure DevOps service URL to use for authentication.
#
# azurerm provider authentication details:
# https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/guides/service_principal_client_secret
# azureClientId: The client ID of the Service Principal.
# azureClientSecret: The client secret of the Service Principal.
# azureSubscriptionId: The subscription ID that should be used.
# azureTenantId: The tenant ID of the Service Principal.
#
# aws provider authentication details:
# https://registry.terraform.io/providers/hashicorp/aws/latest/docs/guides/getting_started
# awsAccessKeyId: The access key for the AWS account.
# awsSecretAccessKey: The secret key for the AWS account.
# awsRegion: The AWS region to use.
# awsDefaultRegion: The default AWS region to use.
# awsSessionToken: The session token for the AWS account.
- name: authentication
  type: object
  displayName: 'An object containing the authentication details (providers, registry, etc.)'

# This object will contain the remote state details
#
# azureStateAccessKey: The access key for the Azure Blob Storage account.
- name: remoteState
  type: object
  displayName: 'An object containing the remote state details (optional)'

  # Example: To set the environment variable "MY_VAR" to "my_value", add the following:
  # - key: MY_VAR
  #   value: my_value
  # - key: MY_OTHER_VAR
  #   value: my_other_value
- name: environmentVariables
  type: object
  displayName: 'Environment variables (key-value pairs, optional)'
  default: []

- name: workingFolder
  type: string
  displayName: 'Terragrunt/Terraform working folder'

steps:
  - script: ${{ parameters.scriptToExecute }}
    displayName: ${{ parameters.displayName }}
    workingDirectory: ${{ parameters.workingFolder }}
    ${{ if ne(parameters.timeoutInMinutes, '') }}:
      timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    env:
      TERRAGRUNT_DOWNLOAD: $(Agent.TempDirectory)
      TERRAGRUNT_LOG_LEVEL: ${{ coalesce(variables['TERRAGRUNT_LOG_LEVEL'], 'info') }}
      ${{ if ne(variables['TF_LOG'], '') }}:
        TF_LOG: $(TF_LOG)
      ###########################################################################
      # terraform remote state details
      ${{ if ne(parameters.remoteState.azureStateAccessKey, '')}}:
        ARM_ACCESS_KEY: ${{ parameters.remoteState.azureStateAccessKey }}
      ###########################################################################
      # terraform registry authentication details
      ${{ if ne(parameters.authentication.terraformRegistryToken, '')}}:
        TF_REGISTRY_TOKEN: ${{ parameters.authentication.terraformRegistryToken }}
      ###########################################################################
      # azuredevops provider authentication details
      ${{ if ne(parameters.authentication.azureDevOpsToken, '')}}:
        AZDO_PERSONAL_ACCESS_TOKEN: ${{ parameters.authentication.azureDevOpsToken }}
      ${{ if ne(parameters.authentication.azureDevOpsServiceUrl, '')}}:
        AZDO_ORG_SERVICE_URL: ${{ parameters.authentication.azureDevOpsServiceUrl }}
      ###########################################################################
      # azurerm provider authentication details
      ${{ if ne(parameters.authentication.azureClientId, '')}}:
        ARM_CLIENT_ID: ${{ parameters.authentication.azureClientId }}
      ${{ if ne(parameters.authentication.azureClientSecret, '')}}:
        ARM_CLIENT_SECRET: ${{ parameters.authentication.azureClientSecret }}
      ${{ if ne(parameters.authentication.azureSubscriptionId, '')}}:
        ARM_SUBSCRIPTION_ID: ${{ parameters.authentication.azureSubscriptionId }}
      ${{ if ne(parameters.authentication.azureTenantId, '')}}:
        ARM_TENANT_ID: ${{ parameters.authentication.azureTenantId }}
      ###########################################################################
      # aws provider authentication details
      ${{ if ne(parameters.authentication.awsAccessKeyId, '')}}:
        AWS_ACCESS_KEY_ID: ${{ parameters.authentication.awsAccessKeyId }}
      ${{ if ne(parameters.authentication.awsSecretAccessKey, '')}}:
        AWS_SECRET_ACCESS_KEY: ${{ parameters.authentication.awsSecretAccessKey }}
      ${{ if ne(parameters.authentication.awsRegion, '')}}:
        AWS_REGION: ${{ parameters.authentication.awsRegion }}
      ${{ if ne(parameters.authentication.awsDefaultRegion, '')}}:
        AWS_DEFAULT_REGION: ${{ parameters.authentication.awsDefaultRegion }}
      ${{ if ne(parameters.authentication.awsSessionToken, '')}}:
        AWS_SESSION_TOKEN: ${{ parameters.authentication.awsSessionToken }}
      ###########################################################################
      # Other environment variables
      ${{ each pair in parameters.environmentVariables }}:
        ${{ pair.key }}: ${{ pair.value }}