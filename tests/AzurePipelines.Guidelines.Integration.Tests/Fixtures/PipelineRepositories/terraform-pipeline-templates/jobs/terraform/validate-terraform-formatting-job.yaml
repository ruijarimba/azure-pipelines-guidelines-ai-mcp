# Validate Terraform source code formatting using `terraform fmt` command in parameters.terraformFolders.

parameters:
  # Set the agent pool to use for this job.
  # If not set, the agent pool must be set at the pipeline level.
  - name: agentPool
    type: object
    displayName: 'Agent pool where to run the job (optional)'
    default: ''
  
  - name: jobTimeoutInMinutes
    type: number
    displayName: 'Job timeout in minutes'
    default: 5

  - name: terraformFolders
    displayName: 'Terraform folders to validate formatting in'
    type: object
    default:
      - $(Build.SourcesDirectory)/iac

  - name: preSteps
    type: stepList
    displayName: 'Pre-steps'
    default:
      - checkout: self

  - name: postSteps
    type: stepList
    displayName: 'Post-steps'
    default: []

jobs:
  - job: validateTerraformFormatting
    displayName: 'Validate Terraform formatting'
    ${{ if parameters.agentPool }}:
      pool: ${{ parameters.agentPool }}
    timeoutInMinutes: ${{ parameters.jobTimeoutInMinutes }}
    steps:
      - ${{ parameters.preSteps }}
      - template: /pipelines/steps/terraform/validate-formatting-steps.yaml
        parameters:
          terraformFolders: ${{ parameters.terraformFolders }}
      - ${{ parameters.postSteps }}