variables:
  - template: /pipelines/variables/helm/hello-world/chart-variables.yaml

  - name: helm_namespace
    value: 'build-agents'

  - name: helm_kubeconfig
    value: /minikube/kubeconfig # use default kubeconfig file (minikube)
  
  # CKV_K8S_15: Image Pull Policy should be Always
  # CKV_K8S_21: Image tag should not be latest
  - name: helm_checkovExclusions
    value: 'CKV_K8S_15,CKV_K8S_21'