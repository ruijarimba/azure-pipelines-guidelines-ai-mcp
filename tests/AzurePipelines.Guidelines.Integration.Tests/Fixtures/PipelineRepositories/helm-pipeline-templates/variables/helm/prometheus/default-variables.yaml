variables:
  - name: helm_chartPath
    value: prometheus-community/kube-prometheus-stack
    readonly: true
  
  - name: helm_repositoryName
    value: prometheus-community
    readonly: true
  
  - name: helm_repositoryUrl
    value: https://prometheus-community.github.io/helm-charts
    readonly: true
  
  - name: helm_releaseName
    value: prometheus
    readonly: true
  
  - name: helm_timeout
    value: 10m0s
    readonly: true

  - name: helm_namespace
    value: monitoring
    readonly: true
  
  - name: helm_kubeconfig
    value: /minikube/kubeconfig # use default kubeconfig file (minikube)
    readonly: true