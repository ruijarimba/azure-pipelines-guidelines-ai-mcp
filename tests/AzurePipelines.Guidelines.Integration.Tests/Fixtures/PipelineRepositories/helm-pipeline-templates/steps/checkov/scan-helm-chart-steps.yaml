# Scan Helm Chart with Checkov and publish the results into the pipeline.
#
# See https://www.checkov.io/7.Scan%20Examples/Helm.html#scan-helm-charts-with-checkov

parameters:
  - name: renderedHelmChartFolder
    type: string
    displayName: 'Folder where the Helm chart will be rendered'
  
  - name: exclusions
    type: string
    displayName: 'Comma-separated list of Checkov checks to exclude'

  - name: testRunTitle
    type: string
    displayName: 'Test run title'
    default: 'checkov-helm'

steps:
  - script: >-
      set -x 

      checkov --framework kubernetes
      --directory $RENDERED_TEMPLATES_FOLDER
      --soft-fail
      --output cli
      --skip-check "$EXCLUSIONS"

      set +x
    condition: eq(variables['System.Debug'], 'true')
    displayName: 'Checkov scan (debug mode)'
    env:
      RENDERED_TEMPLATES_FOLDER: ${{ parameters.renderedHelmChartFolder }}
      EXCLUSIONS: ${{ coalesce(parameters.exclusions, 'DUMMY') }}
      LOG_LEVEL: debug

  # --output-file-path flag doesn't seem to work as expected,
  # i.e. it seems it's not possible to specify the output file path.
  # Output file format is 'results_{format}.xml', e.g. 'results_junitxml.xml'.
  - script: >-
      set -x

      checkov --framework kubernetes
      --directory $RENDERED_TEMPLATES_FOLDER
      --soft-fail
      --quiet
      --output junitxml
      --output-file-path $OUTPUT_FOLDER
      --skip-check "$EXCLUSIONS"

      set +x
    displayName: 'Checkov scan'
    env:
      RENDERED_TEMPLATES_FOLDER: ${{ parameters.renderedHelmChartFolder }}
      EXCLUSIONS: ${{ coalesce(parameters.exclusions, 'DUMMY') }}
      OUTPUT_FOLDER: $(Agent.TempDirectory)
  
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/results_junitxml.xml'
      testRunTitle: ${{ parameters.testRunTitle }}
      searchFolder: $(Agent.TempDirectory)
      failTaskOnFailureToPublishResults: true
      failTaskOnMissingResultsFile: false
    displayName: 'Publish Checkov results: ${{ parameters.testRunTitle }}'