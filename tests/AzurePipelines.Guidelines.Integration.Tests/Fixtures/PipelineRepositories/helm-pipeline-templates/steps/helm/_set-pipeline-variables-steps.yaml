# Sets pipeline variables to be used when running helm commands.
#
# The following pipeline variables are set:
# - HELM_VALUE_FILES_ARGS: The .Values files to pass to the helm commands
# - HELM_PARAMETERS_ARGS: The parameters to pass to the helm commands
#
# Please note that these variables are optional. If no values files or 
# parameters are provided, the variables are set with an empty string.

parameters:
  # An object containing the settings for the Helm chart installation or upgrade:
  # - chartPath: Path to the folder containing the Helm chart or remote repository URL.
  # - releaseName: Release name
  # - valuesFiles: Path to the values files
  # - parameters: Helm parameters
  # - timeout: Time to wait for any individual Kubernetes operation (like Jobs for hooks) (default 5m0s)
  # - dryRun: Set when you want to simulate a helm upgrade
  #     - client: Client side dry-run
  #     - server: Server side dry-run
  - name: helmChart
    type: object
    displayName: 'Helm chart settings'

steps:
  # https://helm.sh/docs/helm/helm_lint/
  - script: |
      set -x # Print all variable values in the stdout
      VALUES_FILES="${{ join(', ', parameters.helmChart.valuesFiles) }}"
      PARAMETERS="${{ join(', ', parameters.helmChart.parameters) }}"
      set +x # Stop printing variables

      VALUES_FILES="${{ join(' -f ', parameters.helmChart.valuesFiles) }}"
      PARAMETERS="${{ join(' --set ', parameters.helmChart.parameters) }}"

      if [ -n "$VALUES_FILES" ]
      then
        VALUES_FILES="-f $VALUES_FILES"
        echo "Found values files"
      fi

      if [ -n "$PARAMETERS" ]
      then
        PARAMETERS="--set $PARAMETERS"
        echo "Found parameters"
      fi

      printf "Setting HELM_VALUE_FILES_ARGS pipeline variable"
      echo "##vso[task.setvariable variable=HELM_VALUE_FILES_ARGS]$VALUES_FILES"

      printf "Setting HELM_PARAMETERS_ARGS pipeline variable"
      echo "##vso[task.setvariable variable=HELM_PARAMETERS_ARGS]$PARAMETERS"
    displayName: 'Set HELM_VALUE_FILES_ARGS, HELM_PARAMETERS_ARGS'