# Validate tools, Helm chart and corresponding parameters
#
# Please note that .Values files and parameters are not validated as these are optional.

parameters:
  # An object containing the settings for the Helm chart installation or upgrade:
  # - chartPath: Path to the folder containing the Helm chart or remote repository URL.
  # - releaseName: Release name
  # - valuesFiles: Path to the values files
  # - parameters: Helm parameters
  # - timeout: Time to wait for any individual Kubernetes operation (like Jobs for hooks) (default 5m0s)
  # - dryRun: Set when you want to simulate a helm upgrade
  #     - client: Client side dry-run
  #     - server: Server side dry-run
  - name: helmChart
    type: object
    displayName: 'Helm chart settings'

  # An object containing the kubernetes context settings:
  # - namespace: Kubernetes namespace
  # - kubeconfig: Path to the kubeconfig file
  - name: kubernetesContext
    type: object
    displayName: 'Kubernetes context settings'

steps:
  - script: |
      RELEASE_NAME="${{ parameters.helmChart.releaseName }}"
      CHART_PATH="${{ parameters.helmChart.chartPath }}"
      NAMESPACE="${{ parameters.kubernetesContext.namespace }}"
      KUBECONFIG="${{ parameters.kubernetesContext.kubeconfig }}"

      EXIT_CODE=0

      printf "Helm version:\n%s\n" "$(helm version)" 
      printf "\nkubectl version:\n%s\n\n" "$(kubectl version --client)"

      if [ -z "$RELEASE_NAME" ]; then
        echo "##vso[task.logissue type=error;code=RELEASE_NAME;]RELEASE_NAME must be provided."
        EXIT_CODE=$((EXIT_CODE+1))
      else
        printf "\nRELEASE_NAME: %s\n" "$RELEASE_NAME"
      fi

      if [ -z "$NAMESPACE" ]; then
        echo "##vso[task.logissue type=error;code=NAMESPACE;]NAMESPACE must be provided."
        EXIT_CODE=$((EXIT_CODE+1))
      else
        printf "\nNAMESPACE: %s\n" "$NAMESPACE"
      fi

      if [ -z "$KUBECONFIG" ]; then
        echo "##vso[task.logissue type=error;code=KUBECONFIG;]KUBECONFIG must be provided."
        EXIT_CODE=$((EXIT_CODE+1))
      else
        printf "\nKUBECONFIG: %s\n" "$KUBECONFIG"
      fi

      if [ -z "$CHART_PATH" ]; then
        echo "##vso[task.logissue type=error;code=CHART_PATH;]CHART_PATH must be provided."
        EXIT_CODE=$((EXIT_CODE+1))
      else
        printf "\nListing files in the chart path: %s\n" "$CHART_PATH"
        ls -R $CHART_PATH
      fi

      exit $EXIT_CODE
    displayName: 'Validate tools and parameters'

  - ${{ each valuesFile in parameters.helmChart.valuesFiles }}:
    - script: |
        FILE="${{ valuesFile }}"

        if [ -f "$FILE" ]; then
          printf "Found file: %s\n\n" "$FILE"
          cat $FILE
        else
          printf "Could not find file: %s\n" "$FILE"
          exit 1
        fi
      displayName: 'Check if .Values file exists: ${{ valuesFile }}'
